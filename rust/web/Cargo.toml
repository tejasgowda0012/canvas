[package]
name = "inkboard_web"
version = "0.10.1"
edition = "2021"
description = "Inkboard in a browser: the same Rust app as on Android and desktop, drawn into a canvas"

[lib]
crate-type = ["cdylib"]

[dependencies]
canvas_core = { path = "../core" }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
